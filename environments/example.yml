---
# Copy this file to environments/local.yml and adapt it to your environment:
#   cp environments/example.yml environments/local.yml
# Run the audit with:
#   ansible-playbook -i inventory.ini audit.yml -e @environments/local.yml

cis_control_expectations:
  '1.2.1.1': >-
    Every active APT repository uses the company Artifactory service and a
    repository-specific Signed-By key.
  '2.1.23': >-
    Only the documented TCP and UDP ports below listen on non-loopback network
    interfaces.
  '5.4.1.2': >-
    PASS_MIN_DAYS and every password-bearing local account have a minimum
    password age of at least 1 day.

# These are regular expressions, not plain strings. Escape dots in hostnames.
# Every active URI must match at least one expression. Include each approved
# Debian repository path used by your organization.
cis_approved_apt_repository_patterns:
  - '^https://artifactory\.example\.com/artifactory/debian($|/)'
  - '^https://artifactory\.example\.com/artifactory/debian-security($|/)'

# Additional filesystem modules that are installed but not required here.
cis_unused_filesystem_modules: []

# Approved non-loopback listeners.
cis_approved_tcp_listening_ports:
  - 22
cis_approved_udp_listening_ports: []

cis_password_min_days: 1

cis_journald_rotation_policy:
  SystemMaxUse: 1G
  SystemKeepFree: 500M
  RuntimeMaxUse: 200M
  RuntimeKeepFree: 50M
  MaxFileSec: 1month

# package_owned accepts files supplied by installed Debian packages. Change to
# allowlist to require every SUID/SGID file to be explicitly listed below.
cis_suid_sgid_review_mode: package_owned
cis_approved_suid_sgid_files: []
