---
- name: Ensure Section 1 configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/modprobe.d
    - /etc/apt/apt.conf.d
    - /etc/apt/sources.list.d
    - /etc/apt/auth.conf.d
    - /etc/apt/trusted.gpg.d
    - /usr/share/keyrings
    - /etc/sysctl.d
    - /etc/default/grub.d

- name: Validate explicitly managed CIS mount definitions
  ansible.builtin.assert:
    that:
      - item.path in ['/tmp', '/dev/shm', '/home', '/var', '/var/tmp', '/var/log', '/var/log/audit']
      - item.src | default('') | length > 0
      - item.fstype | default('') | length > 0
      - item.opts | default('') | length > 0
    fail_msg: Each managed mount requires an approved path, source, filesystem type and options.
  loop: "{{ cis_managed_mounts }}"
  when: cis_allow_partition_changes | bool

- name: Configure explicitly approved CIS mounts
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.opts }}"
    dump: "{{ item.dump | default('0') }}"
    passno: "{{ item.passno | default('0') }}"
    state: mounted
  loop: "{{ cis_managed_mounts }}"
  when: cis_allow_partition_changes | bool

- name: Back up modprobe configuration target
  ansible.builtin.include_tasks: backup.yml
  vars: {cis_backup_source: "{{ cis_modprobe_file }}"}

- name: Validate approved unused filesystem module names
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9_+-]+$')
    fail_msg: "Invalid kernel module name in cis_unused_filesystem_modules: {{ item }}"
  loop: "{{ cis_unused_filesystem_modules }}"
  when: cis_allow_unused_filesystem_module_disable | bool

- name: Disable uncommon filesystem kernel modules
  ansible.builtin.blockinfile:
    path: "{{ cis_modprobe_file }}"
    create: true
    owner: root
    group: root
    mode: '0644'
    marker: "# {mark} CIS DEBIAN 13 KERNEL MODULES"
    block: |
      install cramfs /bin/false
      blacklist cramfs
      install freevxfs /bin/false
      blacklist freevxfs
      install hfs /bin/false
      blacklist hfs
      install hfsplus /bin/false
      blacklist hfsplus
      install jffs2 /bin/false
      blacklist jffs2
      {% if cis_allow_squashfs_disable | bool %}
      install squashfs /bin/false
      blacklist squashfs
      {% endif %}
      install udf /bin/false
      blacklist udf
      install firewire-core /bin/false
      blacklist firewire-core
      {% if cis_allow_usb_storage_disable | bool %}
      install usb-storage /bin/false
      blacklist usb-storage
      {% endif %}
      {% if cis_allow_overlay_disable | bool %}
      install overlay /bin/false
      blacklist overlay
      {% endif %}
      {% if cis_allow_unused_filesystem_module_disable | bool %}
      {% for module in cis_unused_filesystem_modules %}
      install {{ module }} /bin/false
      blacklist {{ module }}
      {% endfor %}
      {% endif %}
  notify: Update initramfs

- name: Unload approved kernel modules
  ansible.builtin.command:
    argv:
      - /usr/sbin/modprobe
      - -r
      - "{{ item }}"
  changed_when: false
  loop: "{{ ['cramfs','freevxfs','hfs','hfsplus','jffs2','udf','firewire-core'] + (['squashfs'] if cis_allow_squashfs_disable | bool else []) + (['usb-storage'] if cis_allow_usb_storage_disable | bool else []) + (['overlay'] if cis_allow_overlay_disable | bool else []) + (cis_unused_filesystem_modules if cis_allow_unused_filesystem_module_disable | bool else []) }}"
  failed_when: false
  when: cis_allow_disruptive | bool

- name: Find active APT source fragments
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns:
      - '*.list'
      - '*.sources'
    file_type: file
  register: cis_existing_apt_source_fragments
  when: cis_allow_apt_source_changes | bool

- name: Validate the approved Artifactory APT source
  ansible.builtin.assert:
    that:
      - cis_approved_apt_source == 'deb http://artifactory.dmz.internal/artifactory/prod-remote-debian-debian trixie main non-free-firmware'
    fail_msg: >-
      cis_approved_apt_source must match the local PASS policy used by control 1.2.1.1.
  when: cis_allow_apt_source_changes | bool

- name: Back up the primary APT source file
  ansible.builtin.include_tasks: backup.yml
  vars:
    cis_backup_source: /etc/apt/sources.list
  when: cis_allow_apt_source_changes | bool

- name: Back up APT source fragments
  ansible.builtin.include_tasks: backup.yml
  vars:
    cis_backup_source: "{{ item.path }}"
  loop: "{{ cis_existing_apt_source_fragments.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: cis_allow_apt_source_changes | bool

- name: Preserve disabled copies of APT source fragments
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ item.path }}.cis-disabled"
    remote_src: true
    owner: root
    group: root
    mode: preserve
  loop: "{{ cis_existing_apt_source_fragments.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: cis_allow_apt_source_changes | bool

- name: Disable other APT source fragments
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ cis_existing_apt_source_fragments.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: cis_allow_apt_source_changes | bool

- name: Configure the approved Artifactory APT source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list
    content: "{{ cis_approved_apt_source }}\n"
    owner: root
    group: root
    mode: '0644'
  when: cis_allow_apt_source_changes | bool

- name: Configure APT weak dependencies
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/60-no-weak-dependencies
    content: |
      APT::Install-Recommends "0";
      APT::Install-Suggests "0";
    owner: root
    group: root
    mode: '0644'

- name: Secure APT directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/apt/trusted.gpg.d, mode: '0755'}
    - {path: /etc/apt/auth.conf.d, mode: '0755'}
    - {path: /usr/share/keyrings, mode: '0755'}
    - {path: /etc/apt/sources.list.d, mode: '0755'}

- name: Find APT source and authentication files
  ansible.builtin.find:
    paths: "{{ item.path }}"
    patterns: "{{ item.patterns }}"
    file_type: file
  loop:
    - {path: /etc/apt/auth.conf.d, patterns: '*'}
    - {path: /etc/apt/sources.list.d, patterns: '*'}
    - {path: /etc/apt/trusted.gpg.d, patterns: '*'}
    - {path: /usr/share/keyrings, patterns: '*'}
  register: cis_apt_files

- name: Secure APT files
  ansible.builtin.file:
    path: "{{ item.1.path }}"
    owner: root
    group: root
    mode: "{{ '0640' if item.0.item.path == '/etc/apt/auth.conf.d' else '0644' }}"
  loop: "{{ cis_apt_files.results | subelements('files', skip_missing=True) }}"

- name: Install and start AppArmor
  ansible.builtin.apt:
    name: [apparmor, apparmor-utils]
    state: present
    update_cache: false
  notify: Restart AppArmor

- name: Enable AppArmor service
  ansible.builtin.systemd_service:
    name: apparmor
    enabled: true
    state: started

- name: Enforce loaded AppArmor profiles
  ansible.builtin.shell: /usr/sbin/aa-enforce /etc/apparmor.d/*
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when: cis_allow_disruptive | bool

- name: Back up sysctl configuration target
  ansible.builtin.include_tasks: backup.yml
  vars: {cis_backup_source: "{{ cis_sysctl_file }}"}

- name: Check AppArmor unprivileged-unconfined sysctl availability
  ansible.builtin.stat:
    path: /proc/sys/kernel/apparmor_restrict_unprivileged_unconfined
  register: cis_apparmor_unprivileged_sysctl

- name: Configure process-hardening kernel parameters
  ansible.builtin.blockinfile:
    path: "{{ cis_sysctl_file }}"
    create: true
    owner: root
    group: root
    mode: '0644'
    marker: "# {mark} CIS PROCESS HARDENING"
    block: |
      fs.suid_dumpable = 0
      kernel.randomize_va_space = 2
      kernel.yama.ptrace_scope = 1
      kernel.dmesg_restrict = 1
      kernel.kptr_restrict = 2
      kernel.unprivileged_bpf_disabled = 1
      net.core.bpf_jit_harden = 2
      {% if cis_apparmor_unprivileged_sysctl.stat.exists %}
      kernel.apparmor_restrict_unprivileged_unconfined = 1
      {% endif %}
  notify: Reload sysctl

- name: Disable core dumps for all users
  ansible.builtin.copy:
    dest: /etc/security/limits.d/60-cis-debian13.conf
    content: "* hard core 0\n"
    owner: root
    group: root
    mode: '0644'

- name: Secure GRUB configuration permissions
  ansible.builtin.file:
    path: /boot/grub/grub.cfg
    owner: root
    group: root
    mode: '0600'
  when: ansible_facts.stat is not defined
  failed_when: false

- name: Validate the supplied GRUB password policy
  ansible.builtin.assert:
    that:
      - cis_grub_superuser | length > 0
      - cis_grub_pbkdf2_hash is match('^grub\\.pbkdf2\\.sha512\\.')
    fail_msg: >-
      Set cis_grub_superuser and a grub.pbkdf2.sha512 hash in
      cis_grub_pbkdf2_hash before enabling bootloader remediation.
  when: cis_allow_bootloader_changes | bool

- name: Configure the GRUB superuser and password hash
  ansible.builtin.copy:
    dest: /etc/grub.d/01_cis_users
    content: |
      #!/bin/sh
      cat <<'CIS_GRUB_USERS'
      set superusers="{{ cis_grub_superuser }}"
      password_pbkdf2 {{ cis_grub_superuser }} {{ cis_grub_pbkdf2_hash }}
      CIS_GRUB_USERS
    owner: root
    group: root
    mode: '0700'
  when: cis_allow_bootloader_changes | bool
  notify: Update GRUB

- name: Configure legal banners
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: "{{ cis_login_banner }}\n"
    owner: root
    group: root
    mode: '0644'
  loop: [/etc/issue, /etc/issue.net]

- name: Configure MOTD permissions
  ansible.builtin.copy:
    dest: /etc/motd
    content: "{{ cis_login_banner }}\n"
    owner: root
    group: root
    mode: '0644'
