---
- name: Secure critical account databases
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/passwd, group: root, mode: '0644'}
    - {path: /etc/passwd-, group: root, mode: '0644'}
    - {path: /etc/group, group: root, mode: '0644'}
    - {path: /etc/group-, group: root, mode: '0644'}
    - {path: /etc/shadow, group: shadow, mode: '0640'}
    - {path: /etc/shadow-, group: shadow, mode: '0640'}
    - {path: /etc/gshadow, group: shadow, mode: '0640'}
    - {path: /etc/gshadow-, group: shadow, mode: '0640'}
  failed_when: false

- name: Find world-writable directories without sticky bit
  ansible.builtin.shell: |
    set -o pipefail
    find / -xdev -type d -perm -0002 ! -perm -1000 -print0 2>/dev/null
  args:
    executable: /bin/bash
  register: cis_world_writable_dirs
  changed_when: false

- name: Set sticky bit on world-writable directories
  ansible.builtin.file:
    path: "{{ item }}"
    mode: 'a+t'
  loop: "{{ cis_world_writable_dirs.stdout.split('\u0000') | reject('equalto', '') | list }}"

- name: Find unowned files on local filesystems
  ansible.builtin.command: /usr/bin/find / -xdev -nouser -print0
  register: cis_unowned_files
  changed_when: false
  failed_when: false

- name: Report unowned files without changing ownership
  ansible.builtin.copy:
    dest: "{{ cis_backup_dir }}/unowned-files.txt"
    content: "{{ cis_unowned_files.stdout | replace('\u0000', '\n') }}"
    owner: root
    group: root
    mode: '0600'

- name: Collect SUID and SGID review inventory
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}"
    found=0
    while read -r target fstype; do
      case "$fstype" in
        ext2|ext3|ext4|xfs|btrfs|zfs|f2fs|jfs|reiserfs|bcachefs|overlay)
          target="${target//\\040/ }"
          while IFS= read -r -d '' file; do
            package="$(dpkg-query -S "$file" 2>/dev/null | head -1 | cut -d: -f1 || true)"
            stat -Lc 'path=%n mode=%a owner=%U group=%G' "$file"
            printf 'package=%s\n\n' "${package:-unowned}"
            found=1
          done < <(find "$target" -xdev -type f \( -perm -4000 -o -perm -2000 \) -print0 2>/dev/null)
          ;;
      esac
    done < <(findmnt -rn -o TARGET,FSTYPE)
    [ "$found" -eq 1 ] || echo 'No SUID or SGID regular files were found on local filesystems.'
  args:
    executable: /bin/bash
  register: cis_suid_sgid_inventory
  changed_when: false

- name: Write SUID and SGID review inventory
  ansible.builtin.copy:
    dest: "{{ cis_backup_dir }}/suid-sgid-inventory.txt"
    content: "{{ cis_suid_sgid_inventory.stdout }}\n"
    owner: root
    group: root
    mode: '0600'
