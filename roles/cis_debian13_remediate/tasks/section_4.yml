---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
  when: cis_allow_firewall_changes | bool

- name: Configure conservative nftables host firewall
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0600'
    validate: 'nft -c -f %s'
  when: cis_allow_firewall_changes | bool
  notify: Restart nftables

- name: Enable nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
  when: cis_allow_firewall_changes | bool
