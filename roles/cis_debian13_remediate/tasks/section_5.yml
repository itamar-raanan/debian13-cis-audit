---
- name: Install sudo and libpam-pwquality
  ansible.builtin.apt:
    name: [sudo, libpam-pwquality, libpam-modules]
    state: present

- name: Ensure authentication configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/sudoers.d
    - /etc/ssh/sshd_config.d
    - /etc/security/pwquality.conf.d

- name: Back up common-password before enabling pwquality
  ansible.builtin.include_tasks: backup.yml
  vars:
    cis_backup_source: /etc/pam.d/common-password
  when: cis_allow_pam_changes | bool

- name: Enable the Debian pwquality PAM profile
  ansible.builtin.shell: |
    set -o pipefail
    if grep -Pqs '^[[:space:]]*password[[:space:]]+[^#]+[[:space:]]+pam_pwquality\.so\b' /etc/pam.d/common-password; then
      echo 'pwquality PAM profile already enabled'
      exit 0
    fi
    /usr/sbin/pam-auth-update --package --enable pwquality
    echo 'pwquality PAM profile enabled'
  args:
    executable: /bin/bash
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: cis_pwquality_pam_profile
  changed_when: "'profile enabled' in cis_pwquality_pam_profile.stdout"
  when: cis_allow_pam_changes | bool

- name: Configure sudo hardening
  ansible.builtin.copy:
    dest: /etc/sudoers.d/60-cis-debian13
    content: |
      Defaults use_pty
      Defaults logfile="/var/log/sudo.log"
      Defaults timestamp_timeout=15
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'

- name: Back up login.defs
  ansible.builtin.include_tasks: backup.yml
  vars:
    cis_backup_source: /etc/login.defs

- name: Back up SSH configuration
  ansible.builtin.include_tasks: backup.yml
  vars: {cis_backup_source: "{{ cis_sshd_dropin }}"}
  when: cis_allow_ssh_changes | bool

- name: Configure OpenSSH server hardening
  ansible.builtin.template:
    src: sshd-cis.conf.j2
    dest: "{{ cis_sshd_dropin }}"
    owner: root
    group: root
    mode: '0600'
    validate: '/usr/sbin/sshd -t -f /etc/ssh/sshd_config'
  when: cis_allow_ssh_changes | bool
  notify: Restart ssh

- name: Configure login.defs password aging and umask
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^\\s*{{ item.key }}\\s+"
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - {key: PASS_MAX_DAYS, value: "{{ cis_password_max_days }}"}
    - {key: PASS_MIN_DAYS, value: "{{ cis_password_min_days }}"}
    - {key: PASS_WARN_AGE, value: "{{ cis_password_warn_age }}"}
    - {key: UMASK, value: "{{ cis_umask }}"}

- name: Validate the approved minimum password age
  ansible.builtin.assert:
    that:
      - cis_password_min_days | int >= 1
      - (cis_password_min_days | string) is match('^[0-9]+$')
    fail_msg: cis_password_min_days must be a positive whole number.
  when: cis_allow_password_age_changes | bool

- name: Find password-bearing accounts below the approved minimum age
  ansible.builtin.shell: |
    awk -F: -v minimum="$CIS_MIN_DAYS" \
      '($2 ~ /^!?\$.+\$/ && ($4 == "" || $4 + 0 < minimum)) {print $1}' /etc/shadow
  args:
    executable: /bin/bash
  environment:
    CIS_MIN_DAYS: "{{ cis_password_min_days | string }}"
  register: cis_password_age_accounts
  changed_when: false
  when: cis_allow_password_age_changes | bool

- name: Apply minimum password age to existing password-bearing accounts
  ansible.builtin.command:
    argv:
      - /usr/bin/chage
      - -m
      - "{{ cis_password_min_days | string }}"
      - "{{ item }}"
  loop: "{{ cis_password_age_accounts.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item }}"
  changed_when: true
  when: cis_allow_password_age_changes | bool

- name: Configure inactive account lock
  ansible.builtin.command:
    argv:
      - /usr/sbin/useradd
      - -D
      - -f
      - "{{ cis_inactive_days | string }}"
  changed_when: false

- name: Back up the managed pwquality policy
  ansible.builtin.include_tasks: backup.yml
  vars:
    cis_backup_source: /etc/security/pwquality.conf.d/60-cis-debian13.conf
  when: cis_allow_pam_changes | bool

- name: Configure pwquality policy
  ansible.builtin.copy:
    dest: /etc/security/pwquality.conf.d/60-cis-debian13.conf
    content: |
      minlen = 14
      minclass = 4
      dcredit = -1
      ucredit = -1
      ocredit = -1
      lcredit = -1
      maxrepeat = 3
      maxsequence = 3
      dictcheck = 1
      enforce_for_root
    owner: root
    group: root
    mode: '0644'
  when: cis_allow_pam_changes | bool

- name: Configure faillock policy
  ansible.builtin.copy:
    dest: /etc/security/faillock.conf
    content: |
      deny = 5
      fail_interval = 900
      unlock_time = 900
      even_deny_root
      root_unlock_time = 60
      audit
      silent
    owner: root
    group: root
    mode: '0644'
  when: cis_allow_pam_changes | bool
