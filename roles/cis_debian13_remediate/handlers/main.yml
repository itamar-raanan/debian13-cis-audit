---
- name: Reload sysctl
  ansible.builtin.command: /usr/sbin/sysctl --system
  changed_when: true
- name: Update initramfs
  ansible.builtin.command: /usr/sbin/update-initramfs -u
  changed_when: true
- name: Restart AppArmor
  ansible.builtin.systemd_service: {name: apparmor, state: restarted}
- name: Restart chrony
  ansible.builtin.systemd_service: {name: chrony, state: restarted}
- name: Restart ssh
  ansible.builtin.systemd_service: {name: ssh, state: restarted}
- name: Update GRUB
  ansible.builtin.command: /usr/sbin/update-grub
  changed_when: true
- name: Restart journald
  ansible.builtin.systemd_service: {name: systemd-journald, state: restarted}
- name: Restart auditd
  ansible.builtin.command: /usr/sbin/service auditd restart
  changed_when: true
- name: Restart journal upload
  ansible.builtin.systemd_service: {name: systemd-journal-upload, state: restarted}
- name: Restart rsyslog
  ansible.builtin.systemd_service: {name: rsyslog, state: restarted}
- name: Load audit rules
  ansible.builtin.shell: |
    export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}"
    if auditctl -s 2>/dev/null | grep -Eq '^enabled[[:space:]]+2$'; then
      echo 'Audit configuration is immutable; rules will load after reboot.'
      exit 0
    fi
    augenrules --load
  args:
    executable: /bin/bash
  changed_when: true
