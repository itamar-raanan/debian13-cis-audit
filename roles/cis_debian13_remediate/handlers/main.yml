---
- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
- name: Update initramfs
  ansible.builtin.command: update-initramfs -u
  changed_when: true
- name: Restart AppArmor
  ansible.builtin.systemd_service: {name: apparmor, state: restarted}
- name: Restart chrony
  ansible.builtin.systemd_service: {name: chrony, state: restarted}
- name: Restart ssh
  ansible.builtin.systemd_service: {name: ssh, state: restarted}
- name: Restart nftables
  ansible.builtin.systemd_service: {name: nftables, state: restarted}
- name: Restart journald
  ansible.builtin.systemd_service: {name: systemd-journald, state: restarted}
- name: Restart auditd
  ansible.builtin.command: service auditd restart
  changed_when: true
- name: Load audit rules
  ansible.builtin.shell: |
    export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}"
    augenrules --load
  args:
    executable: /bin/bash
  changed_when: true
