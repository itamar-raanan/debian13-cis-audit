---
- name: Validate selected CIS profile
  ansible.builtin.assert:
    that:
      - cis_profile in cis_valid_profiles
      - cis_logging_mode in ['journald', 'rsyslog']
    fail_msg: >-
      Unsupported policy selection. cis_profile={{ cis_profile }} must be one of
      {{ cis_valid_profiles | join(', ') }}, and cis_logging_mode={{ cis_logging_mode }}
      must be journald or rsyslog.
  changed_when: false

- name: Validate target operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == cis_benchmark.target_distribution
      - ansible_facts.distribution_major_version == cis_benchmark.target_major_version
    fail_msg: >-
      This role targets Debian 13 only. Detected
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
  changed_when: false
