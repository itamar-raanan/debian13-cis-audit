---
- name: Generate report metadata
  ansible.builtin.set_fact:
    cis_report_hostname: "{{ ansible_hostname | default(inventory_hostname, true) }}"
    cis_report_fqdn: "{{ ansible_fqdn | default('', true) }}"
    cis_report_generated_at: "{{ (ansible_date_time | default({})).iso8601 | default('', true) }}"
    cis_report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    cis_report_default_ipv4_address: "{{ (ansible_default_ipv4 | default({})).address | default('', true) }}"
    cis_report_ip_addresses: >-
      {{
        ansible_all_ipv4_addresses
        | default([], true)
        | reject('match', '^127\\.')
        | unique
        | list
      }}
    cis_report_distribution: "{{ ansible_distribution | default('', true) }}"
    cis_report_distribution_version: "{{ ansible_distribution_version | default('', true) }}"
    cis_report_kernel: "{{ ansible_kernel | default('', true) }}"
    cis_report_architecture: "{{ ansible_architecture | default('', true) }}"
    cis_report_virtualization_type: "{{ ansible_virtualization_type | default('', true) }}"
  changed_when: false

- name: Normalize report IPv4 address list
  ansible.builtin.set_fact:
    cis_report_ip_addresses: >-
      {{
        ([cis_report_default_ipv4_address] + cis_report_ip_addresses)
        | reject('equalto', '')
        | reject('match', '^127\\.')
        | unique
        | list
      }}
  changed_when: false

- name: Select report primary IP address
  ansible.builtin.set_fact:
    cis_report_ip_address: >-
      {{
        cis_report_default_ipv4_address
        if cis_report_default_ipv4_address | length > 0
        and not cis_report_default_ipv4_address.startswith('127.')
        else cis_report_ip_addresses | first | default('')
      }}
  changed_when: false

- name: Hash machine ID for report metadata
  ansible.builtin.command:
    argv:
      - sha256sum
      - /etc/machine-id
  register: cis_report_machine_id_checksum
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read audit project Git commit
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ playbook_dir }}"
      - rev-parse
      - --short=7
      - HEAD
  register: cis_report_git_revision
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  check_mode: false

- name: Finalize report identity metadata
  ansible.builtin.set_fact:
    cis_report_machine_id_hash: >-
      {{
        (cis_report_machine_id_checksum.stdout | default('')).split() | first | default('')
        if cis_report_machine_id_checksum.rc | default(1) == 0
        else ''
      }}
    cis_report_git_commit: >-
      {{
        cis_report_git_revision.stdout | default('') | trim
        if cis_report_git_revision.rc | default(1) == 0
        else ''
      }}
    cis_report_json_path: >-
      {{
        cis_report_dir ~ '/' ~ cis_report_hostname ~
        '/cis_report_' ~ cis_report_hostname ~ '_' ~ cis_report_timestamp ~ '.json'
      }}
  changed_when: false

- name: Ensure report directory exists on controller
  ansible.builtin.file:
    path: "{{ cis_report_dir }}/{{ cis_report_hostname }}"
    state: directory
    mode: '0750'
  delegate_to: localhost
  become: false

- name: Calculate summary
  ansible.builtin.set_fact:
    cis_summary:
      total: "{{ cis_results | length }}"
      pass: "{{ cis_results | selectattr('status', 'equalto', 'PASS') | list | length }}"
      fail: "{{ cis_results | selectattr('status', 'equalto', 'FAIL') | list | length }}"
      review: "{{ cis_results | selectattr('status', 'equalto', 'REVIEW') | list | length }}"
      excluded: "{{ cis_results | selectattr('status', 'equalto', 'EXCLUDED') | list | length }}"
      error: "{{ cis_results | selectattr('status', 'equalto', 'ERROR') | list | length }}"
  changed_when: false

- name: Write JSON report
  ansible.builtin.template:
    src: report.json.j2
    dest: "{{ cis_report_json_path }}"
    mode: '0640'
  register: cis_json_report
  delegate_to: localhost
  become: false
  when: "'json' in cis_report_formats"

- name: Process optional SEC360 JSON upload
  ansible.builtin.include_tasks: sec360_upload.yml

- name: Write CSV report
  ansible.builtin.template:
    src: report.csv.j2
    dest: "{{ cis_report_dir }}/{{ cis_report_hostname }}/cis_report_{{ cis_report_hostname }}_{{ cis_report_timestamp }}.csv"
    mode: '0640'
  delegate_to: localhost
  become: false
  when: "'csv' in cis_report_formats"

- name: Write HTML report
  ansible.builtin.template:
    src: report.html.j2
    dest: "{{ cis_report_dir }}/{{ cis_report_hostname }}/cis_report_{{ cis_report_hostname }}_{{ cis_report_timestamp }}.html"
    mode: '0640'
  delegate_to: localhost
  become: false
  when: "'html' in cis_report_formats"

- name: Display audit summary
  ansible.builtin.debug:
    msg: >-
      CIS audit for {{ inventory_hostname }}: total={{ cis_summary.total }},
      pass={{ cis_summary.pass }}, fail={{ cis_summary.fail }},
      review={{ cis_summary.review }}, excluded={{ cis_summary.excluded }},
      error={{ cis_summary.error }}
