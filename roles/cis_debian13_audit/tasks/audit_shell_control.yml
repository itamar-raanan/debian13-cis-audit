---
- name: "{{ cis_control.id }} | Run audit command"
  ansible.builtin.shell: |
    set -o pipefail
    {{ cis_control.audit }}
  args:
    executable: /bin/bash
  environment:
    CIS_UNUSED_FILESYSTEM_MODULES: "{{ cis_unused_filesystem_modules | default([]) | join(' ') }}"
    CIS_APPROVED_APT_REPOSITORY_PATTERNS: "{{ cis_approved_apt_repository_patterns | default([]) | join('\n') }}"
    CIS_APPROVED_TCP_LISTENING_PORTS: "{{ cis_approved_tcp_listening_ports | default([]) | join(' ') }}"
    CIS_APPROVED_UDP_LISTENING_PORTS: "{{ cis_approved_udp_listening_ports | default([]) | join(' ') }}"
    CIS_PASSWORD_MIN_DAYS: "{{ cis_password_min_days | default(1) | string }}"
    CIS_JOURNALD_SYSTEM_MAX_USE: "{{ cis_journald_rotation_policy.SystemMaxUse | default('') }}"
    CIS_JOURNALD_SYSTEM_KEEP_FREE: "{{ cis_journald_rotation_policy.SystemKeepFree | default('') }}"
    CIS_JOURNALD_RUNTIME_MAX_USE: "{{ cis_journald_rotation_policy.RuntimeMaxUse | default('') }}"
    CIS_JOURNALD_RUNTIME_KEEP_FREE: "{{ cis_journald_rotation_policy.RuntimeKeepFree | default('') }}"
    CIS_JOURNALD_MAX_FILE_SEC: "{{ cis_journald_rotation_policy.MaxFileSec | default('') }}"
    CIS_SUID_SGID_REVIEW_MODE: "{{ cis_suid_sgid_review_mode | default('package_owned') }}"
    CIS_APPROVED_SUID_SGID_FILES: "{{ cis_approved_suid_sgid_files | default([]) | join('\n') }}"
  register: cis_shell_audit
  changed_when: false
  failed_when: false
  tags:
    - "cis_{{ cis_control.id | replace('.', '_') }}"

- name: "{{ cis_control.id }} | Record audit result"
  ansible.builtin.set_fact:
    cis_results: >-
      {{ cis_results + [{
        'id': cis_control.id,
        'title': cis_control.title,
        'section': cis_control.id.rsplit('.', 1)[0],
        'assessment': 'Automated',
        'profiles': cis_control.profiles,
        'status':
          ('EXCLUDED' if cis_control.id in cis_exceptions else
           'PASS' if cis_shell_audit.rc == 0 else
           'FAIL' if cis_shell_audit.rc == 1 else
           'NOT_APPLICABLE' if cis_shell_audit.rc == 3 else 'ERROR'),
        'expected': cis_control_expectations.get(cis_control.id, cis_control.expected),
        'expected_evidence':
          (('The command exits successfully and confirms: ' ~ cis_control_expectations.get(cis_control.id, cis_control.expected))
           if cis_control_expectations.get(cis_control.id, cis_control.expected) != 'System satisfies the benchmark audit procedure' else
           'The command exits successfully and reports no non-compliant findings for this control.'),
        'check_type': 'script',
        'check_commands': [],
        'how_to_check': cis_control.audit,
        'remediation': cis_remediations.get(cis_control.id,
          'Review the control evidence and expected state, apply the approved configuration change, and re-run the audit.'),
        'actual':
          ('Documented exception: ' ~ cis_exceptions[cis_control.id]
           if cis_control.id in cis_exceptions else
           'rc=' ~ (cis_shell_audit.rc | string) ~
           '; stdout=' ~ (cis_shell_audit.stdout | default('') | trim) ~
           '; stderr=' ~ (cis_shell_audit.stderr | default('') | trim)),
        'evidence_text':
          ((cis_shell_audit.stdout | default('') | trim)
           if (cis_shell_audit.stdout | default('') | trim | length) > 0 else
           (cis_shell_audit.stderr | default('') | trim)
           if (cis_shell_audit.stderr | default('') | trim | length) > 0 else
           'The check produced no output.'),
        'evidence': {
          'stdout': cis_shell_audit.stdout_lines | default([]),
          'stderr': cis_shell_audit.stderr_lines | default([]),
          'rc': cis_shell_audit.rc
        }
      }] }}
  changed_when: false
  tags:
    - "cis_{{ cis_control.id | replace('.', '_') }}"
