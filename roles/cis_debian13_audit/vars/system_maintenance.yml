- id: 7.1.11
  title: Ensure world writable files and directories are secured
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    badf=$(find / -xdev -type f -perm -0002 -printf '%m %p\n' 2>/dev/null)
    badd=$(find / -xdev -type d -perm -0002 ! -perm -1000 -printf '%m %p\n' 2>/dev/null)
    [ -z "$badf$badd" ] || { echo "$badf"; echo "$badd"; exit 1; }
    echo 'World-writable objects secured'
- id: 7.1.12
  title: Ensure no files or directories without an owner and a group exist
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    bad=$(find / -xdev \( -nouser -o -nogroup \) -printf '%u %g %p\n' 2>/dev/null)
    if [ -n "$bad" ]; then
      count=$(printf '%s\n' "$bad" | wc -l)
      printf '%s\n' "$bad" | head -n 100
      [ "$count" -le 100 ] || echo "... $((count - 100)) additional unowned or ungrouped objects omitted"
      echo "Total non-compliant objects: $count"
      exit 1
    fi
    echo 'No unowned/ungrouped objects'
- id: 7.2.1
  title: Ensure accounts in /etc/passwd use shadowed passwords
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    bad=$(awk -F: '$2 != "x" {print $1 ":" $2}' /etc/passwd)
    [ -z "$bad" ] || { echo "$bad"; exit 1; }
    echo 'All accounts use shadowed passwords'
