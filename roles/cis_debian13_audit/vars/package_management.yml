  - id: '1.2.2.1'
    title: Ensure updates, patches, and additional security software are installed
    assessment: Automated
    profiles: [level1_server, level1_workstation, level2_server, level2_workstation]
    expected: No pending approved updates and no pending reboot, according to site policy.
    audit: !unsafe |
      command -v apt-get >/dev/null 2>&1 || { echo 'apt-get is unavailable'; exit 2; }
      output="$(LC_ALL=C apt-get -s -o Debug::NoLocking=1 upgrade 2>&1)"
      rc=$?
      [ "$rc" -eq 0 ] || { printf '%s\n' "$output"; exit 2; }
      pending="$(grep -E '^Inst ' <<< "$output" || true)"
      failed=0
      if [ -n "$pending" ]; then
        echo 'Pending package updates:'
        printf '%s\n' "$pending"
        failed=1
      else
        echo 'No pending package updates were found using the current APT metadata.'
      fi
      if [ -e /var/run/reboot-required ]; then
        echo 'A reboot is required.'
        [ ! -r /var/run/reboot-required.pkgs ] || sed 's/^/  package: /' /var/run/reboot-required.pkgs
        failed=1
      else
        echo 'No pending reboot marker exists.'
      fi
      exit "$failed"
