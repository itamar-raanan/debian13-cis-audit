---
cis_package_management_controls:
  - id: '1.2.1.1'
    title: Ensure the source.list and .source files use the Signed-By option
    assessment: Automated
    profiles: [level1_server, level1_workstation, level2_server, level2_workstation]
    expected: >-
      The only active binary APT source is exactly: deb http://artifactory.dmz.internal/artifactory/prod-remote-debian-debian trixie main non-free-firmware
    audit: !unsafe |
      shopt -s nullglob
      files=(/etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources)
      expected='deb http://artifactory.dmz.internal/artifactory/prod-remote-debian-debian trixie main non-free-firmware'
      found=0 failed=0
      for file in "${files[@]}"; do
        [ -f "$file" ] || continue
        case "$file" in
          *.sources)
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              found=$((found + 1))
              if [ "$entry" = "$expected" ]; then
                printf 'PASS: %s: %s\n' "$file" "$entry"
              else
                printf 'FAIL: %s: %s\n' "$file" "$entry"
                failed=1
              fi
            done < <(awk 'BEGIN {RS=""; FS="\n"; IGNORECASE=1}
              { enabled="yes"; types=""; uris=""; suites=""; components="";
                for (i=1; i<=NF; i++) {
                  line=$i
                  if (line ~ /^[[:space:]]*Enabled:/) {sub(/^[^:]*:[[:space:]]*/, "", line); enabled=tolower(line)}
                  if (line ~ /^[[:space:]]*Types:/) {sub(/^[^:]*:[[:space:]]*/, "", line); types=line}
                  if (line ~ /^[[:space:]]*URIs:/) {sub(/^[^:]*:[[:space:]]*/, "", line); uris=line}
                  if (line ~ /^[[:space:]]*Suites:/) {sub(/^[^:]*:[[:space:]]*/, "", line); suites=line}
                  if (line ~ /^[[:space:]]*Components:/) {sub(/^[^:]*:[[:space:]]*/, "", line); components=line}
                }
                if (enabled != "no" && types ~ /(^|[[:space:]])deb([[:space:]]|$)/) {
                  n=split(uris, uri, /[[:space:]]+/); m=split(suites, suite, /[[:space:]]+/)
                  for (u=1; u<=n; u++) for (s=1; s<=m; s++) printf "deb %s %s %s\n", uri[u], suite[s], components
                }
              }' "$file")
            ;;
          *)
            while IFS= read -r line; do
              [[ "$line" =~ ^[[:space:]]*deb[[:space:]] ]] || continue
              entry="$(sed -E 's/^[[:space:]]+//;s/[[:space:]]+/ /g;s/[[:space:]]+$//' <<< "$line")"
              found=$((found + 1))
              if [ "$entry" = "$expected" ]; then
                printf 'PASS: %s: %s\n' "$file" "$entry"
              else
                printf 'FAIL: %s: %s\n' "$file" "$entry"
                failed=1
              fi
            done < <(grep -Pv '^[[:space:]]*#' "$file" 2>/dev/null || true)
            ;;
        esac
      done
      [ "$found" -gt 0 ] || { echo 'FAIL: no active binary APT source was found.'; exit 1; }
      exit "$failed"

  - id: '1.2.1.2'
    title: Ensure weak dependencies are configured
    assessment: Automated
    profiles: [level2_server, level2_workstation]
    expected: APT::Install-Recommends and APT::Install-Suggests are both 0.
    audit: !unsafe |
      recommends="$(apt-config dump 2>/dev/null | awk -F'"' '/^APT::Install-Recommends / {v=$2} END {print v}')"
      suggests="$(apt-config dump 2>/dev/null | awk -F'"' '/^APT::Install-Suggests / {v=$2} END {print v}')"
      printf 'Install-Recommends=%s\nInstall-Suggests=%s\n' "$recommends" "$suggests"
      [[ "$recommends" == "0" && "$suggests" == "0" ]]

  - id: '1.2.1.3'
    title: Ensure access to gpg key files are configured
    assessment: Automated
    profiles: [level1_server, level2_server]
    expected: Relevant GPG and Signed-By source files are root:root and mode 0644 or more restrictive.
    audit: !unsafe |
      bad=0
      while IFS= read -r -d '' file; do
        stat -Lc 'noncompliant: %n mode=%#a owner=%U group=%G' "$file"
        bad=1
      done < <(find -L /usr/share/keyrings /etc/apt/trusted.gpg.d -xdev -type f -name '*gpg' \( ! -user root -o ! -group root -o -perm /133 \) -print0 2>/dev/null)
      while IFS= read -r -d '' file; do
        if grep -Pqs '^([^#\n\r]+)?\bSigned-By\b' "$file"; then
          stat -Lc 'noncompliant: %n mode=%#a owner=%U group=%G' "$file"
          bad=1
        fi
      done < <(find -L /etc/apt/sources.list.d -xdev -type f \( -name '*.list' -o -name '*.sources' \) \( ! -user root -o ! -group root -o -perm /133 \) -print0 2>/dev/null)
      exit "$bad"

  - id: '1.2.1.4'
    title: Ensure access to /etc/apt/trusted.gpg.d directory is configured
    assessment: Automated
    profiles: [level1_server, level2_server]
    expected: /etc/apt/trusted.gpg.d is root:root and mode 0755 or more restrictive.
    audit: !unsafe |
      path=/etc/apt/trusted.gpg.d
      [[ -d "$path" ]] || { echo "missing: $path"; exit 1; }
      read -r mode uid gid < <(stat -Lc '%a %u %g' "$path")
      printf 'mode=%s uid=%s gid=%s\n' "$mode" "$uid" "$gid"
      (( (8#$mode & 8#0022) == 0 )) && [[ "$uid" == 0 && "$gid" == 0 ]]

