---
cis_package_management_controls:
  - id: '1.2.1.1'
    title: Ensure the source.list and .source files use the Signed-By option
    assessment: Automated
    profiles: [level1_server, level1_workstation, level2_server, level2_workstation]
    expected: Every active APT repository uses a repository-specific Signed-By key or embedded key block.
    audit: !unsafe |
      shopt -s nullglob
      files=(/etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources)
      active=0
      failed=0
      repository_patterns="${CIS_APPROVED_APT_REPOSITORY_PATTERNS:-}"
      if [ -n "$repository_patterns" ]; then
        printf 'Approved APT repository patterns:\n%s\n' "$repository_patterns"
      else
        echo 'APT URI approval matching is disabled because cis_approved_apt_repository_patterns is empty.'
      fi
      repository_approved() {
        local uri="$1" pattern
        [ -z "$repository_patterns" ] && return 0
        while IFS= read -r pattern; do
          [ -n "$pattern" ] || continue
          [[ "$uri" =~ $pattern ]] && return 0
        done <<< "$repository_patterns"
        return 1
      }
      check_repository_uri() {
        local uri="$1" location="$2"
        if [ -z "$uri" ]; then
          echo "FAIL: $location has no repository URI"
          failed=1
        elif repository_approved "$uri"; then
          echo "PASS: approved repository URI=$uri ($location)"
        else
          echo "FAIL: unapproved repository URI=$uri ($location)"
          failed=1
        fi
      }
      for file in "${files[@]}"; do
        [ -f "$file" ] || continue
        case "$file" in
          *.sources)
            while IFS='|' read -r stanza enabled types signed_by uris; do
              [ "$enabled" = no ] && continue
              grep -Pqi '(^|\s)deb(\s|$)' <<< "$types" || continue
              active=$((active + 1))
              if [ -z "$signed_by" ]; then
                echo "FAIL: $file stanza $stanza has no Signed-By field"
                failed=1
              else
                echo "PASS: $file stanza $stanza Signed-By=$signed_by"
              fi
              for uri in $uris; do
                check_repository_uri "$uri" "$file stanza $stanza"
              done
              [ -n "$uris" ] || check_repository_uri '' "$file stanza $stanza"
            done < <(awk 'BEGIN {RS=""; FS="\n"; IGNORECASE=1}
              { enabled="yes"; types=""; signed=""; uris="";
                for (i=1; i<=NF; i++) {
                  if ($i ~ /^[[:space:]]*Enabled:/) {sub(/^[^:]*:[[:space:]]*/, "", $i); enabled=tolower($i)}
                  if ($i ~ /^[[:space:]]*Types:/) {sub(/^[^:]*:[[:space:]]*/, "", $i); types=$i}
                  if ($i ~ /^[[:space:]]*Signed-By:/) {sub(/^[^:]*:[[:space:]]*/, "", $i); signed=($i == "" ? "embedded-key" : $i)}
                  if ($i ~ /^[[:space:]]*URIs:/) {sub(/^[^:]*:[[:space:]]*/, "", $i); uris=$i}
                }
                printf "%d|%s|%s|%s|%s\n", NR, enabled, types, signed, uris
              }' "$file")
            ;;
          *)
            while IFS= read -r line; do
              [[ "$line" =~ ^[[:space:]]*deb(-src)?[[:space:]] ]] || continue
              active=$((active + 1))
              repository="$(sed -E 's/^[[:space:]]*deb(-src)?[[:space:]]+//' <<< "$line")"
              [[ "$repository" != \[* ]] || repository="${repository#*]}"
              read -r uri _ <<< "$repository"
              check_repository_uri "$uri" "$file"
              if grep -Pqi '^[[:space:]]*deb(?:-src)?[[:space:]]+\[[^]]*\bsigned-by\s*=' <<< "$line"; then
                echo "PASS: $file: $line"
              else
                echo "FAIL: $file active repository has no signed-by option: $line"
                failed=1
              fi
            done < <(grep -Pv '^[[:space:]]*#' "$file" 2>/dev/null || true)
            ;;
        esac
      done
      [ "$active" -gt 0 ] || { echo 'FAIL: no active APT repositories were found'; exit 1; }
      exit "$failed"

  - id: '1.2.1.2'
    title: Ensure weak dependencies are configured
    assessment: Automated
    profiles: [level2_server, level2_workstation]
    expected: APT::Install-Recommends and APT::Install-Suggests are both 0.
    audit: !unsafe |
      recommends="$(apt-config dump 2>/dev/null | awk -F'"' '/^APT::Install-Recommends / {v=$2} END {print v}')"
      suggests="$(apt-config dump 2>/dev/null | awk -F'"' '/^APT::Install-Suggests / {v=$2} END {print v}')"
      printf 'Install-Recommends=%s\nInstall-Suggests=%s\n' "$recommends" "$suggests"
      [[ "$recommends" == "0" && "$suggests" == "0" ]]

  - id: '1.2.1.3'
    title: Ensure access to gpg key files are configured
    assessment: Automated
    profiles: [level1_server, level2_server]
    expected: Relevant GPG and Signed-By source files are root:root and mode 0644 or more restrictive.
    audit: !unsafe |
      bad=0
      while IFS= read -r -d '' file; do
        stat -Lc 'noncompliant: %n mode=%#a owner=%U group=%G' "$file"
        bad=1
      done < <(find -L /usr/share/keyrings /etc/apt/trusted.gpg.d -xdev -type f -name '*gpg' \( ! -user root -o ! -group root -o -perm /133 \) -print0 2>/dev/null)
      while IFS= read -r -d '' file; do
        if grep -Pqs '^([^#\n\r]+)?\bSigned-By\b' "$file"; then
          stat -Lc 'noncompliant: %n mode=%#a owner=%U group=%G' "$file"
          bad=1
        fi
      done < <(find -L /etc/apt/sources.list.d -xdev -type f \( -name '*.list' -o -name '*.sources' \) \( ! -user root -o ! -group root -o -perm /133 \) -print0 2>/dev/null)
      exit "$bad"

  - id: '1.2.1.4'
    title: Ensure access to /etc/apt/trusted.gpg.d directory is configured
    assessment: Automated
    profiles: [level1_server, level2_server]
    expected: /etc/apt/trusted.gpg.d is root:root and mode 0755 or more restrictive.
    audit: !unsafe |
      path=/etc/apt/trusted.gpg.d
      [[ -d "$path" ]] || { echo "missing: $path"; exit 1; }
      read -r mode uid gid < <(stat -Lc '%a %u %g' "$path")
      printf 'mode=%s uid=%s gid=%s\n' "$mode" "$uid" "$gid"
      (( (8#$mode & 8#0022) == 0 )) && [[ "$uid" == 0 && "$gid" == 0 ]]

