  - id: '1.2.2.1'
    title: Ensure updates, patches, and additional security software are installed
    assessment: Automated
    profiles: [level1_server, level1_workstation, level2_server, level2_workstation]
    expected: >-
      APT metadata is no more than 24 hours old, a simulated full upgrade reports no pending packages, no packages are held, and no reboot is pending. The audit never refreshes metadata or installs updates.
    audit: !unsafe |
      command -v apt-get >/dev/null 2>&1 || { echo 'apt-get is unavailable.'; exit 2; }
      failed=0
      newest="$(find /var/lib/apt/lists -maxdepth 1 -type f -printf '%T@\n' 2>/dev/null | sort -n | tail -1)"
      now="$(date +%s)"
      if [ -z "$newest" ]; then
        echo 'FAIL: no APT package metadata was found.'
        failed=1
      else
        age=$((now - ${newest%.*}))
        if [ "$age" -le 86400 ]; then
          printf 'PASS: newest APT metadata is %s seconds old (maximum 86400).\n' "$age"
        else
          printf 'FAIL: newest APT metadata is %s seconds old (maximum 86400). Run apt-get update.\n' "$age"
          failed=1
        fi
      fi
      output="$(LC_ALL=C apt-get -s -o Debug::NoLocking=1 full-upgrade 2>&1)"
      rc=$?
      [ "$rc" -eq 0 ] || { printf '%s\n' "$output"; exit 2; }
      pending="$(grep -E '^Inst ' <<< "$output" || true)"
      if [ -n "$pending" ]; then
        echo 'FAIL: pending package updates:'
        printf '%s\n' "$pending"
        failed=1
      else
        echo 'PASS: no pending package updates.'
      fi
      held="$(apt-mark showhold 2>/dev/null || true)"
      if [ -n "$held" ]; then
        echo 'FAIL: held packages:'
        printf '%s\n' "$held"
        failed=1
      else
        echo 'PASS: no held packages.'
      fi
      if [ -e /var/run/reboot-required ]; then
        echo 'FAIL: a reboot is required.'
        [ ! -r /var/run/reboot-required.pkgs ] || sed 's/^/package: /' /var/run/reboot-required.pkgs
        failed=1
      else
        echo 'PASS: no reboot is pending.'
      fi
      exit "$failed"
