  - id: '1.2.2.1'
    title: Ensure updates, patches, and additional security software are installed
    assessment: Manual
    profiles: [level1_server, level1_workstation, level2_server, level2_workstation]
    expected: No pending approved updates and no pending reboot, according to site policy.
    guidance: Run apt update and apt -s upgrade, then review /var/run/reboot-required. This role does not refresh package metadata.
    evidence_description: Pending upgrades from current APT metadata, held packages, and reboot-required state.
    audit: !unsafe |
      echo '=== Pending upgrades using current package metadata ==='
      if command -v apt-get >/dev/null 2>&1; then
        LC_ALL=C apt-get -s -o Debug::NoLocking=1 upgrade 2>&1 | grep -E '^(Inst |[0-9]+ upgraded,)' || echo 'No pending upgrades were reported.'
      else
        echo 'apt-get is not installed.'
      fi
      echo
      echo '=== Held packages ==='
      held="$(apt-mark showhold 2>/dev/null || true)"
      [ -n "$held" ] && printf '%s\n' "$held" || echo 'No held packages.'
      echo
      echo '=== Reboot state ==='
      if [ -e /var/run/reboot-required ]; then
        echo 'reboot_required=yes'
        [ ! -r /var/run/reboot-required.pkgs ] || sed 's/^/package=/' /var/run/reboot-required.pkgs
      else
        echo 'reboot_required=no'
      fi
      metadata="$(find /var/lib/apt/lists -maxdepth 1 -type f -printf '%T@\n' 2>/dev/null | sort -n | tail -1)"
      [ -z "$metadata" ] || printf 'newest_apt_metadata_epoch=%s\n' "$metadata"
    review: >-
      Confirm the APT metadata is recent enough for your patch-management process. Review every pending and held package against approved maintenance windows and exceptions, paying special attention to security updates. Confirm any reboot-required marker has an approved and scheduled reboot. Record accepted deferrals with an owner and expiration date.
