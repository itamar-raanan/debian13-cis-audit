    grep -Pq '(/usr/bin/sudo|key=(sudo|privileged)|-k[[:space:]]+(sudo|privileged))' <<<"$run" || { echo 'Running audit rule missing: (/usr/bin/sudo|key=(sudo|privileged)|-k[[:space:]]+(sudo|privileged))'; exit 1; }
