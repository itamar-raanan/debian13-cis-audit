cis_section6_manual_controls:
- id: 6.1.1.1.2
  title: Ensure journald log file access is configured
  assessment: Automated
  profiles:
  - level1_server
  - level1_workstation
  expected: Existing journal files are owned by root, group-owned by root or systemd-journal, and mode 0640 or more restrictive.
  audit: !unsafe |
    found=0 failed=0
    for directory in /var/log/journal /run/log/journal; do
      [ -d "$directory" ] || continue
      while IFS= read -r -d '' file; do
        found=1
        read -r mode uid group < <(stat -Lc '%a %u %G' "$file")
        if [ "$uid" -eq 0 ] && [[ "$group" =~ ^(root|systemd-journal)$ ]] && [ $((8#$mode & 8#0137)) -eq 0 ]; then
          printf 'PASS: %s mode=%s owner=root group=%s\n' "$file" "$mode" "$group"
        else
          printf 'FAIL: %s mode=%s uid=%s group=%s\n' "$file" "$mode" "$uid" "$group"
          failed=1
        fi
      done < <(find "$directory" -xdev -type f -name '*.journal*' -print0 2>/dev/null)
    done
    [ "$found" -eq 1 ] || { echo 'No journal files exist yet; file access cannot be evaluated.'; exit 3; }
    exit "$failed"
- id: 6.1.1.1.3
  title: Ensure journald log file rotation is configured
  assessment: Automated
  profiles:
  - level1_server
  - level1_workstation
  expected: >-
    Effective journald rotation matches the CIS best-practice example: SystemMaxUse=1G, SystemKeepFree=500M, RuntimeMaxUse=200M, RuntimeKeepFree=50M, and MaxFileSec=1month.
  audit: !unsafe |
    command -v systemd-analyze >/dev/null 2>&1 || { echo 'systemd-analyze is unavailable.'; exit 2; }
    config="$(systemd-analyze cat-config systemd/journald.conf 2>&1)" || { printf '%s\n' "$config"; exit 2; }
    failed=0
    check_setting() {
      local key="$1" expected="$2" actual
      actual="$(awk -F= -v key="$key" '$0 !~ /^[[:space:]]*[#;]/ && $1 ~ "^[[:space:]]*" key "[[:space:]]*$" {value=$2} END {gsub(/^[[:space:]]+|[[:space:]]+$/, "", value); print value}' <<< "$config")"
      if [ "${actual,,}" = "${expected,,}" ]; then
        printf 'PASS: %s=%s\n' "$key" "$actual"
      else
        printf 'FAIL: %s=%s expected=%s\n' "$key" "${actual:-unset}" "$expected"
        failed=1
      fi
    }
    check_setting SystemMaxUse 1G
    check_setting SystemKeepFree 500M
    check_setting RuntimeMaxUse 200M
    check_setting RuntimeKeepFree 50M
    check_setting MaxFileSec 1month
    exit "$failed"
- id: 6.1.1.2.2
  title: Ensure systemd-journal-upload authentication is configured
  assessment: Manual
  profiles:
  - level1_server
  - level1_workstation
  expected: Manual review required by the benchmark
  guidance: Follow the CIS Debian Linux 13 Benchmark v1.0.0 audit procedure and retain site-specific evidence.
  evidence_description: Effective journal-upload URL and authentication file paths, plus metadata for referenced key and certificate files.
  audit: !unsafe |
    if command -v systemd-analyze >/dev/null 2>&1; then
      config="$(systemd-analyze cat-config systemd/journal-upload.conf 2>&1 || true)"
    else
      config="$(cat /etc/systemd/journal-upload.conf /etc/systemd/journal-upload.conf.d/*.conf 2>/dev/null || true)"
    fi
    values="$(grep -P '^[[:space:]]*(URL|ServerKeyFile|ServerCertificateFile|TrustedCertificateFile)[[:space:]]*=' <<< "$config" || true)"
    [ -n "$values" ] && printf '%s\n' "$values" || echo 'No journal-upload authentication settings were found.'
    while IFS= read -r path; do
      [ -n "$path" ] || continue
      if [ -e "$path" ]; then
        stat -Lc 'referenced_file=%n mode=%a owner=%U group=%G' "$path"
      else
        printf 'referenced_file=%s state=missing\n' "$path"
      fi
    done < <(grep -Po '^[[:space:]]*(ServerKeyFile|ServerCertificateFile|TrustedCertificateFile)[[:space:]]*=\K.*' <<< "$config" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || true)
  review: >-
    Confirm URL names the approved remote journal service and uses the required secure transport. Verify the private key, client certificate, and trusted CA paths are all configured, exist, and have restrictive ownership and permissions. Confirm certificates belong to the approved PKI, are not expired, and match the destination. Never include private-key contents in the review record.
- id: 6.1.2.5
  title: Ensure rsyslog logging is configured
  assessment: Manual
  profiles:
  - level1_server
  - level1_workstation
  expected: Manual review required by the benchmark
  guidance: Follow the CIS Debian Linux 13 Benchmark v1.0.0 audit procedure and retain site-specific evidence.
  evidence_description: Active rsyslog selectors, actions, file destinations, and configuration-validation output.
  audit: !unsafe |
    echo '=== rsyslog configuration validation ==='
    if command -v rsyslogd >/dev/null 2>&1; then
      rsyslogd -N1 2>&1 || true
    else
      echo 'rsyslogd is not installed.'
    fi
    echo
    echo '=== Active selectors and actions ==='
    lines="$(grep -RPHn '^[[:space:]]*[^#[:space:]].*' /etc/rsyslog.conf /etc/rsyslog.d 2>/dev/null | grep -E '(/var/log/|action[[:space:]]*\(|@@?[^[:space:]]+|^[^:]+:[0-9]+:[[:space:]]*[^#$])' || true)"
    [ -n "$lines" ] && printf '%s\n' "$lines" || echo 'No active rsyslog selectors or destinations were found.'
  review: >-
    Confirm the configuration validation reports no syntax errors. Compare active selectors and actions with the organization logging standard: required authentication, authorization, daemon, kernel, mail, emergency, and security events should reach approved local or remote destinations. Check for dropped facilities, overly broad stop/discard rules, duplicate routing, and destinations with inappropriate access.
- id: 6.1.2.6
  title: Ensure rsyslog is configured to send logs to a remote log host
  assessment: Manual
  profiles:
  - level1_server
  - level1_workstation
  expected: Manual review required by the benchmark
  guidance: Follow the CIS Debian Linux 13 Benchmark v1.0.0 audit procedure and retain site-specific evidence.
  evidence_description: Every active rsyslog remote-forwarding rule, including target, port, protocol, queue, and TLS settings present in the rule.
  audit: !unsafe |
    forwarding="$(grep -RPHni '^[[:space:]]*[^#].*(@@?[^[:space:]]+|type[[:space:]]*=[[:space:]]*"?omfwd"?|target[[:space:]]*=)' /etc/rsyslog.conf /etc/rsyslog.d 2>/dev/null || true)"
    [ -n "$forwarding" ] && printf '%s\n' "$forwarding" || echo 'No active remote rsyslog forwarding rules were found.'
  review: >-
    Verify every remote target is an approved central log host and that its port, TCP/UDP transport, TLS mode, and queue behavior match policy. Prefer reliable TCP with authenticated TLS where required. Confirm forwarding covers the required facilities, survives temporary network outages, and does not send sensitive logs to an unauthorized destination.
- id: 6.1.2.8
  title: Ensure logrotate is configured
  assessment: Manual
  profiles:
  - level1_server
  - level1_workstation
  expected: Manual review required by the benchmark
  guidance: Follow the CIS Debian Linux 13 Benchmark v1.0.0 audit procedure and retain site-specific evidence.
  evidence_description: Loaded logrotate policies and debug output showing rotation frequency, retention, compression, ownership, and file handling.
  audit: !unsafe |
    if command -v logrotate >/dev/null 2>&1 && [ -r /etc/logrotate.conf ]; then
      logrotate --debug /etc/logrotate.conf 2>&1 || true
    elif [ -r /etc/logrotate.conf ]; then
      echo 'logrotate is not installed; showing configuration files instead.'
      cat /etc/logrotate.conf /etc/logrotate.d/* 2>/dev/null || true
    else
      echo '/etc/logrotate.conf is missing or unreadable.'
    fi
  review: >-
    Review each important log path for an explicit or inherited rotation policy. Confirm frequency, rotate count or age, compression, copytruncate/postrotate behavior, file creation mode, owner, and group meet retention and operational requirements. Ensure security and audit logs cannot grow without limit and are not deleted before centralized retention obligations are met.
- id: 6.1.2.11
  title: Ensure rsyslog CA certificates are configured
  assessment: Manual
  profiles:
  - level2_server
  - level2_workstation
  expected: Manual review required by the benchmark
  guidance: Follow the CIS Debian Linux 13 Benchmark v1.0.0 audit procedure and retain site-specific evidence.
  evidence_description: Configured rsyslog CA certificate paths with file metadata and non-secret certificate subject, issuer, and validity dates.
  audit: !unsafe |
    config="$(grep -RPHn '^[[:space:]]*[^#]' /etc/rsyslog.conf /etc/rsyslog.d 2>/dev/null || true)"
    ca_lines="$(grep -Pi '(DefaultNetstreamDriverCAFile|StreamDriver\.CAFile)' <<< "$config" || true)"
    [ -n "$ca_lines" ] && printf '%s\n' "$ca_lines" || echo 'No rsyslog CA certificate setting was found.'
    while IFS= read -r file; do
      [ -n "$file" ] || continue
      if [ -f "$file" ]; then
        stat -Lc 'ca_file=%n mode=%a owner=%U group=%G' "$file"
        command -v openssl >/dev/null 2>&1 && openssl x509 -in "$file" -noout -subject -issuer -dates 2>/dev/null || true
      else
        printf 'ca_file=%s state=missing\n' "$file"
      fi
    done < <(grep -Poi '(DefaultNetstreamDriverCAFile|StreamDriver\.CAFile)[[:space:]]*=?[[:space:]]*"?\K[^"[:space:]]+' <<< "$config" | sort -u || true)
  review: >-
    Confirm every configured CA file is the organization-approved trust anchor for the remote logging service. Review owner, group, and mode for unnecessary write access, then verify the certificate subject, issuer, and validity period. Investigate missing, expired, unexpected, or world-writable CA files and confirm rsyslog TLS peer-authentication settings use them.
- id: 6.2.3.37
  title: Ensure the running and on disk configuration is the same
  assessment: Automated
  profiles:
  - level2_server
  - level2_workstation
  expected: >-
    Best practice is for augenrules --check to report that the compiled rules are current and for the active kernel watch/syscall rules to match /etc/audit/audit.rules after whitespace normalization.
  audit: !unsafe |
    command -v augenrules >/dev/null 2>&1 || { echo 'augenrules is unavailable.'; exit 2; }
    command -v auditctl >/dev/null 2>&1 || { echo 'auditctl is unavailable.'; exit 2; }
    check_output="$(augenrules --check 2>&1)"
    check_rc=$?
    printf '%s\n' "$check_output"
    [ "$check_rc" -eq 0 ] || exit 1
    [ -r /etc/audit/audit.rules ] || { echo '/etc/audit/audit.rules is missing or unreadable.'; exit 1; }
    normalize_rules() {
      sed -E 's/^[[:space:]]+//;s/[[:space:]]+/ /g;s/[[:space:]]+$//' | grep -E '^(-a|-w)[[:space:]]' | sort -u
    }
    disk_rules="$(normalize_rules < /etc/audit/audit.rules)"
    running_output="$(auditctl -l 2>&1)"
    running_rc=$?
    [ "$running_rc" -eq 0 ] || { printf '%s\n' "$running_output"; exit 2; }
    running_rules="$(normalize_rules <<< "$running_output")"
    if diff_output="$(diff -u <(printf '%s\n' "$disk_rules") <(printf '%s\n' "$running_rules") 2>&1)"; then
      echo 'PASS: running watch/syscall audit rules match /etc/audit/audit.rules.'
    else
      echo 'FAIL: running and on-disk audit rules differ.'
      printf '%s\n' "$diff_output"
      exit 1
    fi
