---
cis_section6_controls:
- id: 6.1.1.1.1
  title: Ensure journald service is active
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    systemctl is-enabled systemd-journald.service 2>/dev/null | grep -qx enabled || { echo 'systemd-journald.service is not enabled'; exit 1; }
    systemctl is-active systemd-journald.service 2>/dev/null | grep -qx active || { echo 'systemd-journald.service is not active'; exit 1; }
    echo 'systemd-journald.service is enabled and active'
- id: 6.1.1.1.4
  title: Ensure journald ForwardToSyslog is disabled
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    v=$(grep -hE '^[[:space:]]*ForwardToSyslog[[:space:]]*=' /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*.conf 2>/dev/null | sed -E 's/^[^=]+=[[:space:]]*//;s/[[:space:]]*(#.*)?$//' | tail -1 | tr '[:upper:]' '[:lower:]')
    [ "$v" = "no" ] || { echo 'ForwardToSyslog='"${v:-unset}"', expected no'; exit 1; }
    echo 'ForwardToSyslog='$v
- id: 6.1.1.1.5
  title: Ensure journald Storage is configured
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    v=$(systemd-analyze cat-config systemd/journald.conf 2>/dev/null | awk -F= '/^[[:space:]]*Storage[[:space:]]*=/{gsub(/[[:space:]]/,"",$2);v=tolower($2)}END{print v}')
    case "$v" in persistent|auto) echo "Storage=$v";; *) echo "Storage=${v:-unset}"; exit 1;; esac
- id: 6.1.1.1.6
  title: Ensure journald Compress is configured
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    v=$(systemd-analyze cat-config systemd/journald.conf 2>/dev/null | awk -F= '/^[[:space:]]*Compress[[:space:]]*=/{gsub(/[[:space:]]/,"",$2);v=tolower($2)}END{print v}')
    [ "$v" = yes ] || { echo "Compress=${v:-unset}"; exit 1; }
    echo 'Compress=yes'
- id: 6.1.1.2.1
  title: Ensure systemd-journal-remote is installed
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    dpkg-query -W -f='${db:Status-Status} ${Version}\n' systemd-journal-remote 2>/dev/null | grep -q '^installed ' || { echo 'systemd-journal-remote is not installed'; exit 1; }
    dpkg-query -W -f='systemd-journal-remote=${Version}\n' systemd-journal-remote
- id: 6.1.1.2.3
  title: Ensure systemd-journal-upload is enabled and active
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    systemctl is-enabled systemd-journal-upload.service 2>/dev/null | grep -qx enabled || { echo 'systemd-journal-upload.service is not enabled'; exit 1; }
    systemctl is-active systemd-journal-upload.service 2>/dev/null | grep -qx active || { echo 'systemd-journal-upload.service is not active'; exit 1; }
    echo 'systemd-journal-upload.service is enabled and active'
- id: 6.1.1.2.4
  title: Ensure systemd-journal-remote service is not in use
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    e=$(systemctl is-enabled systemd-journal-remote.socket 2>/dev/null || true)
    a=$(systemctl is-active systemd-journal-remote.socket 2>/dev/null || true)
    [ "$e" != enabled ] && [ "$a" != active ] || { echo "enabled=$e active=$a"; exit 1; }
    echo 'systemd-journal-remote is not in use'
