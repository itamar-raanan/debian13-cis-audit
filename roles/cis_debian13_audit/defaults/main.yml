---
cis_benchmark:
  name: "CIS Debian Linux 13 Benchmark"
  version: "1.0.0"
  release_date: "2025-12-16"
  target_distribution: "Debian"
  target_major_version: "13"

cis_profile: level1_server
cis_logging_mode: rsyslog

# CIS Level 2 is cumulative: it includes the matching Level 1 baseline.
cis_profile_inheritance:
  level1_server: [level1_server]
  level2_server: [level1_server, level2_server]
  level1_workstation: [level1_workstation]
  level2_workstation: [level1_workstation, level2_workstation]
cis_effective_profiles: "{{ cis_profile_inheritance[cis_profile] | default([cis_profile]) }}"

cis_report_dir: "{{ playbook_dir }}/reports"
cis_report_formats: [json, csv, html]
cis_report_schema_version: "1.1"
cis_audit_tool_version: "1.1.0"
cis_sec360_upload_enabled: false
cis_sec360_url: ""
cis_sec360_token: ""
cis_sec360_validate_certs: true
cis_sec360_ca_path: ""
cis_exceptions: {}
cis_results: []

cis_valid_profiles:
  - level1_server
  - level2_server
  - level1_workstation
  - level2_workstation
